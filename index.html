<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Market Report | Hilong Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="news">

<div class="top">
  <div class="wrap">
    <a class="brand" href="index.html">Hilong Brasil<span>Market Report</span></a>
    <nav class="nav" aria-label="Pages">
      <a href="index.html" aria-current="page" data-i18n="navNews"></a>
      <a href="live.html" data-i18n="navLive"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="pt" aria-pressed="false">PT</button>
    </div>
  </div>
</div>

<header class="mast">
  <div class="wrap">
    <h1>Market Report</h1>
    <p class="sub" data-i18n="sub"></p>
    <div class="mast-foot">
      <p class="edition" id="edition" aria-live="polite"></p>
      <a class="to-live" href="live.html"><span class="live" aria-hidden="true"></span><span data-i18n="openLive"></span></a>
    </div>
  </div>
</header>

<div class="filters" id="filters">
  <div class="wrap">
    <div class="seg" role="group" id="regionSeg" aria-label="Region"></div>
    <label class="sr" for="opSel" data-i18n="operator"></label>
    <select id="opSel"></select>
    <label class="sr" for="catSel" data-i18n="category"></label>
    <select id="catSel"></select>
    <label class="sr" for="envSel" data-i18n="envT"></label>
    <select id="envSel"></select>
    <label class="sr" for="q" data-i18n="search"></label>
    <input type="search" id="q" autocomplete="off">
  </div>
</div>

<main class="news">
  <div class="wrap">
    <div class="legend" id="legend"></div>
    <div id="log"></div>
  </div>
</main>

<footer class="foot">
  <div class="wrap"><p data-i18n="foot"></p></div>
</footer>

<script src="assets/site.js"></script>
</body>
</html>
