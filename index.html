<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Market Report | Hilong Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF1F1;
    --sheet: #FFFFFF;
    --ink: #13262B;
    --muted: #55686E;
    --line: #CFD9DA;
    --petrol: #0C4650;
    --petrol-deep: #082F36;
    --br: #0E7C66;
    --sa: #B36B00;
    --signal: #F2B705;
    /* chart colours, validated for the dark panel (#082F36) */
    --bar: #199E70;
    --env-onshore: #D95926;
    --env-offshore: #3987E5;
    --env-geral: #C98500;
    --on-dark: #FFFFFF;
    --on-dark-2: rgba(255,255,255,.74);
    --track: rgba(255,255,255,.11);
    --hair: rgba(255,255,255,.16);
    --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Masthead */
  .mast { background: var(--petrol); color: #fff; }
  .mast .wrap { padding-top: 22px; padding-bottom: 30px; }
  .mast-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: .01em; opacity: .9; }
  .lang { display: inline-flex; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; overflow: hidden; }
  .lang button {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: transparent;
    border: 0; padding: 6px 12px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--petrol-deep); }
  .mast h1 {
    margin: 26px 0 6px;
    font-stretch: 68%;
    font-weight: 800;
    font-size: clamp(44px, 9vw, 92px);
    line-height: .92;
    letter-spacing: -.01em;
  }
  .mast .sub { margin: 0; font-size: clamp(17px, 2.2vw, 21px); max-width: 34em; opacity: .92; }
  .edition { margin: 18px 0 0; font-size: 15px; opacity: .85; }
  .edition strong { font-weight: 700; }

  /* Pulse: live indicators */
  .pulse { background: var(--petrol-deep); color: var(--on-dark); }
  .pulse .wrap { padding-top: 22px; padding-bottom: 30px; }
  .pulse-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
  .pulse-head h2 { margin: 0 auto 0 0; font-size: 22px; font-weight: 700; font-stretch: 88%; display: flex; align-items: center; gap: 10px; }
  .live { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .scope { display: inline-flex; border: 1px solid var(--hair); border-radius: 4px; overflow: hidden; }
  .scope button {
    position: relative; font: inherit; font-size: 14px; font-weight: 600; color: var(--on-dark-2);
    background: transparent; border: 0; border-right: 1px solid var(--hair); padding: 7px 13px; cursor: pointer; white-space: nowrap;
  }
  .scope button:last-child { border-right: 0; }
  .scope button[aria-pressed="true"] { color: #fff; background: rgba(255,255,255,.1); }
  .scope button[aria-pressed="true"]::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--signal);
    transform-origin: left; transform: scaleX(1);
  }
  .pulse.auto .scope button[aria-pressed="true"]::after { animation: fill 7s linear; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .ctl {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: transparent;
    border: 1px solid var(--hair); border-radius: 4px; padding: 7px 13px; cursor: pointer;
  }

  .ticker { margin-top: 18px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); overflow: hidden; display: flex; align-items: center; }
  .ticker-label { flex: none; font-size: 14px; font-weight: 700; padding: 9px 14px 9px 0; margin-right: 14px; border-right: 1px solid var(--hair); }
  .ticker-view { overflow: hidden; flex: 1; }
  .ticker-run { display: inline-flex; white-space: nowrap; animation: slide 60s linear infinite; }
  .ticker-run span { font-size: 15px; padding: 9px 0; margin-right: 44px; color: var(--on-dark-2); }
  .ticker-run span b { color: #fff; font-weight: 700; margin-right: 8px; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .pulse.paused .ticker-run, .ticker:hover .ticker-run { animation-play-state: paused; }
  .pulse.paused .live { animation: none; }

  .tiles { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 0; margin-top: 22px; }
  .tile { padding: 0 20px; border-left: 1px solid var(--hair); }
  .tile:first-child { padding-left: 0; border-left: 0; }
  .tile .v { display: block; font-weight: 800; font-stretch: 75%; font-size: 40px; line-height: 1; }
  .tile.hero .v { font-size: 64px; }
  .tile .l { display: block; margin-top: 6px; font-size: 15px; color: var(--on-dark-2); }

  .charts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 32px; margin-top: 28px; }
  .chart h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .rows { display: grid; gap: 7px; }
  .row {
    display: grid; grid-template-columns: minmax(0, 46%) 1fr 26px; align-items: center; gap: 10px;
    font: inherit; font-size: 14px; color: var(--on-dark-2); background: transparent; border: 0; padding: 2px 0; text-align: left; width: 100%;
  }
  button.row { cursor: pointer; }
  button.row:hover .name, button.row:focus-visible .name { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .trk { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .row .fill { display: block; height: 100%; width: 0; background: var(--bar); border-radius: 0 4px 4px 0; transition: width .7s cubic-bezier(.2,.7,.2,1); }
  .row .num { text-align: right; color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .none { font-size: 14px; color: var(--on-dark-2); margin: 0; }

  .seg-bar { display: flex; gap: 2px; height: 28px; }
  .seg-bar button {
    font: inherit; font-size: 13px; font-weight: 700; color: #0A1F24; border: 0; border-radius: 4px; padding: 0 0 0 8px;
    text-align: left; cursor: pointer; min-width: 0; overflow: hidden; white-space: nowrap; flex-basis: 0;
    transition: flex-grow .7s cubic-bezier(.2,.7,.2,1);
  }
  .seg-bar button:hover, .seg-bar button:focus-visible { filter: brightness(1.12); }
  .legend-d { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; font-size: 14px; color: var(--on-dark-2); }
  .legend-d i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }

  .days { display: flex; align-items: flex-end; gap: 3px; height: 74px; border-bottom: 1px solid var(--hair); }
  .days button {
    flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; padding: 0; cursor: default;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  }
  .days .col { display: block; width: 100%; max-width: 24px; background: var(--bar); border-radius: 4px 4px 0 0; height: 0; transition: height .7s cubic-bezier(.2,.7,.2,1); }
  .days .col.zero { background: var(--track); }
  .days button:hover .col, .days button:focus-visible .col { filter: brightness(1.2); }
  .days .top { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .days-axis { display: flex; justify-content: space-between; font-size: 13px; color: var(--on-dark-2); margin-top: 5px; }

  .radar { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .radar-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .radar-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .radar-head p { margin: 0; font-size: 14px; color: var(--on-dark-2); }
  .radar-now { margin-left: auto; font-size: 14px; color: var(--on-dark-2); }
  .radar-now b { color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
  .chips li {
    font-size: 14px; padding: 4px 10px; border: 1px solid var(--hair); border-radius: 3px; color: var(--on-dark-2);
    transition: background-color .35s, color .35s, border-color .35s;
  }
  .chips li.on { background: var(--signal); border-color: var(--signal); color: #0A1F24; font-weight: 700; }

  .tip {
    position: fixed; z-index: 20; pointer-events: none; background: #fff; color: var(--ink); font-size: 13px;
    padding: 6px 9px; border-radius: 4px; box-shadow: 0 4px 14px rgba(8,47,54,.28); white-space: nowrap; display: none;
  }
  .tip b { font-weight: 800; margin-right: 6px; }

  /* Filters */
  .filters { background: var(--sheet); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .filters .wrap { display: flex; flex-wrap: wrap; gap: 12px 12px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--sheet);
    border: 0; border-right: 1px solid var(--line); padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .seg button:last-child { border-right: 0; }
  .seg button .n { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .seg button[aria-pressed="true"] { background: var(--petrol-deep); color: #fff; }
  .seg button[aria-pressed="true"] .n { color: rgba(255,255,255,.75); }
  .filters select, .filters input[type="search"] {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 40px; max-width: 190px;
  }
  .filters input[type="search"] { flex: 1 1 150px; min-width: 130px; max-width: none; }

  /* Log */
  main .wrap { padding-top: 28px; padding-bottom: 56px; }
  .day { display: grid; grid-template-columns: 112px 1fr; }
  .day-label { position: relative; padding: 2px 20px 0 0; text-align: right; font-stretch: 75%; line-height: 1.1; }
  .day-label .d { display: block; font-size: 27px; font-weight: 800; white-space: nowrap; }
  .day-label .w { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .day-label .inner { position: sticky; top: 76px; }
  .track { border-left: 2px solid var(--petrol); padding: 0 0 26px 0; position: relative; }
  .day:last-child .track { padding-bottom: 0; }
  .track::before { content: ""; position: absolute; left: -12px; top: 16px; width: 12px; height: 2px; background: var(--petrol); }
  .item {
    position: relative; background: var(--sheet); margin: 0 0 10px 22px; padding: 16px 20px 16px;
    border: 1px solid var(--line); border-radius: 3px;
  }
  .item::before {
    content: ""; position: absolute; left: -29px; top: 22px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--br); border: 2px solid var(--paper);
  }
  .item[data-region="SA"]::before { background: var(--sa); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; margin-bottom: 6px; }
  .tags .op { font-weight: 700; }
  .tags .ct { color: var(--br); font-weight: 600; }
  .item[data-region="SA"] .tags .ct { color: var(--sa); }
  .tags .cat, .tags .env { color: var(--muted); }
  .item h2 { margin: 0 0 6px; font-size: 21px; line-height: 1.22; font-weight: 700; font-stretch: 88%; max-width: 34em; }
  .item h2 a { text-decoration: none; }
  .item h2 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .item p { margin: 0; max-width: 66ch; }
  .item .src { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .item .src a { color: var(--petrol); font-weight: 600; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--muted); margin: 0 0 22px 112px; padding-left: 24px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; background: var(--br); }
  .legend .sa i { background: var(--sa); }

  .state { background: var(--sheet); border: 1px solid var(--line); border-radius: 3px; padding: 28px 24px; max-width: 40em; }
  .state h2 { margin: 0 0 6px; font-size: 21px; }
  .state p { margin: 0 0 14px; color: var(--muted); }
  .state button {
    font: inherit; font-weight: 600; font-size: 15px; background: var(--petrol-deep); color: #fff;
    border: 0; border-radius: 4px; padding: 9px 16px; cursor: pointer;
  }

  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding-top: 20px; padding-bottom: 36px; font-size: 14px; color: var(--muted); }
  footer p { margin: 0; max-width: 70ch; }

  @media (max-width: 860px) {
    .charts { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .wrap { padding: 0 16px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 18px 0; }
    .tile:nth-child(3) { padding-left: 0; border-left: 0; }
    .tile.hero .v { font-size: 48px; }
    .tile .v { font-size: 34px; }
    .charts { grid-template-columns: 1fr; }
    .radar-now { margin-left: 0; width: 100%; }
    .day { grid-template-columns: 1fr; }
    .day-label { text-align: left; padding: 0 0 8px; }
    .day-label .inner { position: static; display: flex; align-items: baseline; gap: 10px; }
    .day-label .d { font-size: 24px; }
    .track { margin-left: 5px; }
    .track::before { display: none; }
    .item { margin-left: 18px; padding: 14px 16px; }
    .item::before { left: -25px; }
    .legend { margin-left: 0; padding-left: 0; }
    .filters { position: static; }
    .seg { width: 100%; }
    .seg button { flex: 1; padding: 8px 6px; }
    .filters select { flex: 1 1 45%; min-width: 0; max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live, .ticker-run, .pulse.auto .scope button[aria-pressed="true"]::after { animation: none; }
    .ticker-view { overflow-x: auto; }
    .row .fill, .days .col, .seg-bar button, .chips li { transition: none; }
  }
</style>
</head>
<body>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <span class="brand">Hilong Brasil</span>
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </div>
    <h1>Market Report</h1>
    <p class="sub" data-i18n="sub"></p>
    <p class="edition" id="edition" aria-live="polite"></p>
  </div>
</header>

<section class="pulse" id="pulse" aria-labelledby="pulseTitle">
  <div class="wrap">
    <div class="pulse-head">
      <h2 id="pulseTitle"><span class="live" aria-hidden="true"></span><span data-i18n="pulse"></span></h2>
      <div class="scope" role="group" id="scopeSeg" aria-label="Scope"></div>
      <button type="button" class="ctl" id="pauseBtn"></button>
    </div>

    <div class="ticker">
      <span class="ticker-label" data-i18n="latest"></span>
      <div class="ticker-view"><div class="ticker-run" id="ticker"></div></div>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="charts">
      <div class="chart"><h3 data-i18n="topics"></h3><div class="rows" id="cTopics"></div></div>
      <div class="chart"><h3 data-i18n="companies"></h3><div class="rows" id="cCompanies"></div></div>
      <div class="chart"><h3 data-i18n="countriesT"></h3><div class="rows" id="cCountries"></div></div>
      <div class="chart"><h3 data-i18n="envT"></h3><div id="cEnv"></div></div>
      <div class="chart"><h3 data-i18n="perDay"></h3><div id="cDays"></div></div>
      <div class="chart"><h3 data-i18n="channels"></h3><div class="rows" id="cChannels"></div></div>
    </div>

    <div class="radar" id="radar" hidden>
      <div class="radar-head">
        <h3 data-i18n="radar"></h3>
        <p id="radarLine"></p>
        <span class="radar-now" id="radarNow"></span>
      </div>
      <ul class="chips" id="chips"></ul>
    </div>
  </div>
</section>

<div class="filters" id="filters">
  <div class="wrap">
    <div class="seg" role="group" id="regionSeg" aria-label="Region"></div>
    <label class="sr" for="opSel" data-i18n="operator"></label>
    <select id="opSel"></select>
    <label class="sr" for="catSel" data-i18n="category"></label>
    <select id="catSel"></select>
    <label class="sr" for="envSel" data-i18n="envT"></label>
    <select id="envSel"></select>
    <label class="sr" for="q" data-i18n="search"></label>
    <input type="search" id="q" autocomplete="off">
  </div>
</div>

<main>
  <div class="wrap">
    <div class="legend" id="legend"></div>
    <div id="log"></div>
  </div>
</main>

<footer>
  <div class="wrap"><p data-i18n="foot"></p></div>
</footer>

<div class="tip" id="tip" role="status"></div>

      chs: { site: "Websites", linkedin: "LinkedIn", youtube: "YouTube", x: "X" },
      cats: { resultados: "Results", producao: "Production", perfuracao: "Drilling", investimentos: "Investment", contratos: "Contracts and tenders", regulatorio: "Regulation", exploracao: "Exploration", mercado: "Market", fusoes: "M&A", outros: "Other" },
      countries: { BR: "Brazil", AR: "Argentina", CO: "Colombia", GY: "Guyana", SR: "Suriname", PE: "Peru", EC: "Ecuador", BO: "Bolivia", VE: "Venezuela", CL: "Chile", UY: "Uruguay", PY: "Paraguay", TT: "Trinidad and Tobago" }
    }
  };

  var ENV_ORDER = ["onshore", "offshore", "geral"];
  var ENV_COLOR = { onshore: "var(--env-onshore)", offshore: "var(--env-offshore)", geral: "var(--env-geral)" };
  var CH_ORDER = ["site", "linkedin", "youtube", "x"];
  var SCOPES = ["all", "BR", "SA"];
  var ROTATE_MS = 7000;

  var state = { lang: "en", region: "all", op: "", cat: "", env: "", q: "" };
  var data = { updated_at: null, items: [] };
  var run = null;
  var failed = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pulse = { scope: "all", auto: !reduce, rot: null, rad: null, radIdx: 0 };

  try {
    var saved = localStorage.getItem("mr_lang_v2");
    if (saved === "pt" || saved === "en") state.lang = saved;
  } catch (e) { /* storage unavailable */ }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function t() { return T[state.lang]; }
  function locale() { return state.lang === "pt" ? "pt-BR" : "en-GB"; }
  function parseDay(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function isoDay(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function opName(o) { return o === "Setor" ? t().sector : o; }
  function envOf(it) { return ENV_ORDER.indexOf(it.environment) > -1 ? it.environment : "geral"; }
  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
  function title(it) { return it["title_" + state.lang] || it.title_en || it.title_pt; }

  function matches(it, skipRegion) {
    if (!skipRegion && state.region !== "all" && it.region !== state.region) return false;
    if (state.op && it.operator !== state.op) return false;
    if (state.cat && it.category !== state.cat) return false;
    if (state.env && envOf(it) !== state.env) return false;
    if (state.q) {
      var hay = norm([it.title_pt, it.title_en, it.summary_pt, it.summary_en, it.operator, it.source].join(" "));
      if (hay.indexOf(norm(state.q)) === -1) return false;
    }
    return true;
  }

  /* ---------- Pulse ---------- */

  function scoped() {
    return data.items.filter(function (it) { return pulse.scope === "all" || it.region === pulse.scope; });
  }
  function countBy(list, fn) {
    var m = {};
    list.forEach(function (it) { var k = fn(it); if (k) m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).map(function (k) { return { k: k, n: m[k] }; })
      .sort(function (a, b) { return b.n - a.n || a.k.localeCompare(b.k); });
  }
  function grow(fn) { requestAnimationFrame(function () { requestAnimationFrame(fn); }); }

  function countUp(node, to) {
    var from = parseInt(node.textContent, 10) || 0;
    if (reduce || from === to) { node.textContent = String(to); return; }
    var t0 = null, dur = 600;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      node.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function tiles(list) {
    var L = t(), box = $("tiles");
    var vals = [
      [list.length, L.kStories, "hero"],
      [countBy(list, function (it) { return it.operator === "Setor" ? "" : it.operator; }).length, L.kCompanies, ""],
      [countBy(list, function (it) { return it.country; }).length, L.kCountries, ""],
      [countBy(list, function (it) { return it.source; }).length, L.kSources, ""]
    ];
    if (!box.children.length) {
      vals.forEach(function (v) {
        var d = el("div", "tile" + (v[2] ? " " + v[2] : ""));
        d.appendChild(el("span", "v", "0")); d.appendChild(el("span", "l"));
        box.appendChild(d);
      });
    }
    vals.forEach(function (v, i) {
      var d = box.children[i];
      countUp(d.querySelector(".v"), v[0]);
      d.querySelector(".l").textContent = v[1];
    });
  }

  function bars(box, rows, labelFn, onPick) {
    box.textContent = "";
    if (!rows.length) { box.appendChild(el("p", "none", t().noData)); return; }
    var max = rows[0].n;
    rows.forEach(function (r) {
      var row = el(onPick ? "button" : "div", "row");
      if (onPick) { row.type = "button"; row.addEventListener("click", function () { onPick(r.k); }); }
      var label = labelFn(r.k);
      row.appendChild(el("span", "name", label));
      var trk = el("span", "trk"), fill = el("span", "fill");
      trk.appendChild(fill); row.appendChild(trk);
      row.appendChild(el("span", "num", String(r.n)));
      row.title = label + ": " + r.n;
      box.appendChild(row);
      grow(function () { fill.style.width = Math.max(4, Math.round(r.n / max * 100)) + "%"; });
    });
  }

  function envBar(list) {
    var L = t(), box = $("cEnv");
    box.textContent = "";
    if (!list.length) { box.appendChild(el("p", "none", L.noData)); return; }
    var counts = {}; ENV_ORDER.forEach(function (e) { counts[e] = 0; });
    list.forEach(function (it) { counts[envOf(it)]++; });
    var bar = el("div", "seg-bar"), legend = el("div", "legend-d");
    ENV_ORDER.forEach(function (e) {
      if (!counts[e]) return;
      var share = Math.round(counts[e] / list.length * 100);
      var b = el("button", null, share >= 12 ? share + "%" : "");
      b.type = "button"; b.style.background = ENV_COLOR[e]; b.style.flexGrow = "0.0001";
      var label = L.envs[e] + ": " + counts[e] + " (" + share + "%)";
      b.title = label; b.setAttribute("aria-label", label);
      b.addEventListener("click", function () { pick("env", e); });
      bar.appendChild(b);
      grow(function () { b.style.flexGrow = String(counts[e]); });
      var li = el("span"); var sw = el("i"); sw.style.background = ENV_COLOR[e];
      li.appendChild(sw); li.appendChild(document.createTextNode(L.envs[e] + " " + counts[e]));
      legend.appendChild(li);
    });
    box.appendChild(bar); box.appendChild(legend);
  }

  function dayCols(list) {
    var L = t(), box = $("cDays");
    box.textContent = "";
    if (!data.items.length) { box.appendChild(el("p", "none", L.noData)); return; }
    var last = data.items.reduce(function (m, it) { return it.date > m ? it.date : m; }, "0000-00-00");
    var end = parseDay(last), days = [], N = 14;
    for (var i = N - 1; i >= 0; i--) { var d = new Date(end); d.setDate(end.getDate() - i); days.push(d); }
    var per = {}; list.forEach(function (it) { per[it.date] = (per[it.date] || 0) + 1; });
    var max = 0; days.forEach(function (d) { max = Math.max(max, per[isoDay(d)] || 0); });
    var fmt = new Intl.DateTimeFormat(locale(), { day: "numeric", month: "short" });
    var wrap = el("div", "days"), labelled = false;
    days.forEach(function (d) {
      var n = per[isoDay(d)] || 0;
      var b = el("button"); b.type = "button";
      var text = fmt.format(d) + ": " + n + " " + (n === 1 ? L.story1 : L.storyN);
      b.setAttribute("aria-label", text);
      if (n && n === max && !labelled) { b.appendChild(el("span", "top", String(n))); labelled = true; }
      var col = el("span", "col" + (n ? "" : " zero"));
      b.appendChild(col);
      b.addEventListener("pointermove", function (ev) { showTip(ev.clientX, ev.clientY, String(n), fmt.format(d)); });
      b.addEventListener("pointerleave", hideTip);
      b.addEventListener("focus", function () { var r = b.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top, String(n), fmt.format(d)); });
      b.addEventListener("blur", hideTip);
      wrap.appendChild(b);
      grow(function () { col.style.height = (n ? Math.max(4, Math.round(n / max * 52)) : 2) + "px"; });
    });
    var axis = el("div", "days-axis");
    axis.appendChild(el("span", null, fmt.format(days[0])));
    axis.appendChild(el("span", null, fmt.format(days[N - 1])));
    box.appendChild(wrap); box.appendChild(axis);
  }

  function showTip(x, y, value, label) {
    var tip = $("tip"); tip.textContent = "";
    tip.appendChild(el("b", null, value)); tip.appendChild(document.createTextNode(label));
    tip.style.display = "block";
    var w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + "px";
    tip.style.top = Math.max(8, y - 40) + "px";
  }
  function hideTip() { $("tip").style.display = "none"; }

  function pick(key, value) {
    state[key] = state[key] === value ? "" : value;
    render();
    $("filters").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }

  function renderScope() {
    var L = t(), seg = $("scopeSeg"); seg.textContent = "";
    SCOPES.forEach(function (s) {
      var b = el("button", null, L[s]); b.type = "button";
      b.setAttribute("aria-pressed", String(pulse.scope === s));
      b.addEventListener("click", function () { pulse.scope = s; setAuto(false); renderScope(); renderPulseData(); });
      seg.appendChild(b);
    });
    $("pauseBtn").textContent = pulse.auto ? L.pause : L.resume;
    $("pulse").classList.toggle("auto", pulse.auto);
    $("pulse").classList.toggle("paused", !pulse.auto);
  }

  function renderPulseData() {
    var L = t(), list = scoped();
    tiles(list);
    bars($("cTopics"), countBy(list, function (it) { return it.category; }).slice(0, 6),
      function (k) { return L.cats[k] || k; }, function (k) { pick("cat", k); });
    bars($("cCompanies"), countBy(list, function (it) { return it.operator === "Setor" ? "" : it.operator; }).slice(0, 6),
      function (k) { return k; }, function (k) { pick("op", k); });
    bars($("cCountries"), countBy(list, function (it) { return it.country; }).slice(0, 6),
      function (k) { return L.countries[k] || k; }, null);
    envBar(list);
    dayCols(list);
    var ch = {}; list.forEach(function (it) { ch[it.via] = (ch[it.via] || 0) + 1; });
    var chRows = CH_ORDER.map(function (c) { return { k: c, n: ch[c] || 0 }; });
    var box = $("cChannels"); box.textContent = "";
    var cmax = Math.max.apply(null, chRows.map(function (r) { return r.n; })) || 1;
    chRows.forEach(function (r) {
      var row = el("div", "row");
      row.appendChild(el("span", "name", L.chs[r.k]));
      var trk = el("span", "trk"), fill = el("span", "fill"); trk.appendChild(fill); row.appendChild(trk);
      row.appendChild(el("span", "num", String(r.n)));
      box.appendChild(row);
      grow(function () { fill.style.width = (r.n ? Math.max(4, Math.round(r.n / cmax * 100)) : 0) + "%"; });
    });
  }

  function renderTicker() {
    var box = $("ticker"); box.textContent = "";
    var list = data.items.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).slice(0, 12);
    if (!list.length) return;
    for (var pass = 0; pass < 2; pass++) {
      list.forEach(function (it) {
        var s = el("span"); if (pass) s.setAttribute("aria-hidden", "true");
        s.appendChild(el("b", null, opName(it.operator)));
        s.appendChild(document.createTextNode(title(it)));
        box.appendChild(s);
      });
    }
    box.style.animationDuration = Math.max(40, list.length * 7) + "s";
  }

  function renderRadar() {
    var L = t(), box = $("radar");
    if (!run || !Array.isArray(run.terms) || !run.terms.length) { box.hidden = true; return; }
    box.hidden = false;
    var when = run.run_at ? new Intl.DateTimeFormat(locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" }).format(new Date(run.run_at)) : "";
    $("radarLine").textContent = L.radarLine.replace("{n}", run.searches || run.terms.length).replace("{d}", when).replace("{m}", run.new_items || 0);
    var ul = $("chips"); ul.textContent = "";
    run.terms.forEach(function (term) { ul.appendChild(el("li", null, term)); });
    radarStep(0);
  }
  function radarStep(i) {
    var lis = $("chips").children; if (!lis.length) return;
    pulse.radIdx = i % lis.length;
    for (var k = 0; k < lis.length; k++) lis[k].classList.toggle("on", k === pulse.radIdx && pulse.auto);
    var now = $("radarNow"); now.textContent = "";
    if (pulse.auto) {
      now.appendChild(document.createTextNode(t().watching + " "));
      now.appendChild(el("b", null, lis[pulse.radIdx].textContent));
    }
  }

  function setAuto(on) {
    pulse.auto = on;
    clearInterval(pulse.rot); clearInterval(pulse.rad);
    if (on) {
      pulse.rot = setInterval(function () {
        pulse.scope = SCOPES[(SCOPES.indexOf(pulse.scope) + 1) % SCOPES.length];
        renderScope(); renderPulseData();
      }, ROTATE_MS);
      pulse.rad = setInterval(function () { radarStep(pulse.radIdx + 1); }, 1300);
    }
    radarStep(pulse.radIdx);
  }

  function renderPulse() { renderScope(); renderTicker(); renderPulseData(); renderRadar(); }

  $("pauseBtn").addEventListener("click", function () { setAuto(!pulse.auto); renderScope(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearInterval(pulse.rot); clearInterval(pulse.rad); }
    else if (pulse.auto) setAuto(true);
  });

  /* ---------- Filters and list ---------- */

  function fillSelect(sel, first, keys, labelFn, value) {
    sel.textContent = "";
    var o0 = el("option", null, first); o0.value = ""; sel.appendChild(o0);
    keys.forEach(function (k) { var o = el("option", null, labelFn(k)); o.value = k; sel.appendChild(o); });
    sel.value = value;
  }

  function regionCounts() {
    var btns = $("regionSeg").querySelectorAll("button");
    ["all", "BR", "SA"].forEach(function (r, i) {
      var n = data.items.filter(function (it) { return matches(it, true) && (r === "all" || it.region === r); }).length;
      if (btns[i]) btns[i].querySelector(".n").textContent = String(n);
    });
  }

  function renderChrome() {
    var L = t();
    document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      n.textContent = L[n.getAttribute("data-i18n")];
    });
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang));
    });
    $("q").placeholder = L.searchPh;

    var seg = $("regionSeg"); seg.textContent = "";
    ["all", "BR", "SA"].forEach(function (r) {
      var b = el("button"); b.type = "button";
      b.setAttribute("aria-pressed", String(state.region === r));
      b.appendChild(document.createTextNode(L[r]));
      b.appendChild(el("span", "n", "0"));
      b.addEventListener("click", function () { state.region = r; render(); });
      seg.appendChild(b);
    });
    regionCounts();

    var ops = {}, cats = {}, envs = {};
    data.items.forEach(function (it) { ops[it.operator] = 1; cats[it.category] = 1; envs[envOf(it)] = 1; });
    fillSelect($("opSel"), L.allOps, Object.keys(ops).sort(function (a, b) {
      if (a === "Setor") return 1; if (b === "Setor") return -1; return a.localeCompare(b);
    }), opName, state.op);
    fillSelect($("catSel"), L.allCats, Object.keys(cats).sort(function (a, b) {
      return (L.cats[a] || a).localeCompare(L.cats[b] || b);
    }), function (c) { return L.cats[c] || c; }, state.cat);
    fillSelect($("envSel"), L.allEnvs, ENV_ORDER.filter(function (e) { return envs[e]; }),
      function (e) { return L.envs[e]; }, state.env);

    var lg = $("legend"); lg.textContent = "";
    var a = el("span", "br"); a.appendChild(el("i")); a.appendChild(document.createTextNode(L.BR)); lg.appendChild(a);
    var s = el("span", "sa"); s.appendChild(el("i")); s.appendChild(document.createTextNode(L.SA)); lg.appendChild(s);

    var ed = $("edition"); ed.textContent = "";
    if (data.updated_at) {
      var when = new Intl.DateTimeFormat(locale(), {
        day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo"
      }).format(new Date(data.updated_at));
      ed.appendChild(document.createTextNode(L.updated + " "));
      ed.appendChild(el("strong", null, when));
    }
  }

  function stateBox(titleText, text, btn, fn) {
    var box = el("div", "state");
    box.appendChild(el("h2", null, titleText));
    box.appendChild(el("p", null, text));
    var b = el("button", null, btn); b.type = "button"; b.addEventListener("click", fn);
    box.appendChild(b);
    return box;
  }

  function renderLog() {
    var L = t();
    var log = $("log"); log.textContent = "";
    if (failed) {
      log.appendChild(stateBox(L.errT, L.errP, L.reload, function () { location.reload(); }));
      return;
    }
    var list = data.items.filter(function (it) { return matches(it, false); });
    list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!list.length) {
      log.appendChild(stateBox(L.emptyT, L.emptyP, L.clear, function () {
        state.region = "all"; state.op = ""; state.cat = ""; state.env = ""; state.q = ""; $("q").value = ""; render();
      }));
      return;
    }
    var monFmt = new Intl.DateTimeFormat(locale(), { month: "short" });
    var wkFmt = new Intl.DateTimeFormat(locale(), { weekday: "long" });
    var viaLabels = { linkedin: "LinkedIn", x: "X", youtube: "YouTube" };
    var current = null, track = null;
    list.forEach(function (it) {
      if (it.date !== current) {
        current = it.date;
        var day = el("section", "day");
        var lab = el("div", "day-label");
        var inner = el("div", "inner");
        var dt = parseDay(it.date);
        inner.appendChild(el("span", "d", dt.getDate() + " " + monFmt.format(dt).replace(".", "")));
        inner.appendChild(el("span", "w", wkFmt.format(dt)));
        lab.appendChild(inner);
        track = el("div", "track");
        day.appendChild(lab); day.appendChild(track);
        log.appendChild(day);
      }
      var art = el("article", "item");
      art.setAttribute("data-region", it.region);
      var tags = el("div", "tags");
      tags.appendChild(el("span", "op", opName(it.operator)));
      tags.appendChild(el("span", "ct", L.countries[it.country] || it.country));
      tags.appendChild(el("span", "cat", L.cats[it.category] || it.category));
      if (envOf(it) !== "geral") tags.appendChild(el("span", "env", L.envs[envOf(it)]));
      art.appendChild(tags);
      var h = el("h2");
      var a = el("a", null, title(it));
      a.href = safeUrl(it.url); a.target = "_blank"; a.rel = "noopener noreferrer";
      h.appendChild(a); art.appendChild(h);
      art.appendChild(el("p", null, it["summary_" + state.lang] || it.summary_en || it.summary_pt));
      var src = el("p", "src");
      var via = viaLabels[it.via];
      src.appendChild(document.createTextNode(L.source + ": " + it.source + (via ? " (" + via + ")" : "") + ", "));
      var sa = el("a", null, L.read);
      sa.href = safeUrl(it.url); sa.target = "_blank"; sa.rel = "noopener noreferrer";
      src.appendChild(sa);
      art.appendChild(src);
      track.appendChild(art);
    });
  }

  function render() { renderChrome(); renderLog(); }

  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () {
      state.lang = b.getAttribute("data-lang");
      try { localStorage.setItem("mr_lang_v2", state.lang); } catch (e) { /* ignore */ }
      render(); renderPulse();
    });
  });
  $("opSel").addEventListener("change", function (e) { state.op = e.target.value; render(); });
  $("catSel").addEventListener("change", function (e) { state.cat = e.target.value; render(); });
  $("envSel").addEventListener("change", function (e) { state.env = e.target.value; render(); });
  $("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); regionCounts(); renderLog(); });

  function start(payload) {
    data = { updated_at: payload.updated_at || null, items: Array.isArray(payload.items) ? payload.items : [] };
    render(); renderPulse(); setAuto(pulse.auto); renderScope();
  }

  function getJson(path) {
    return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status); return r.json();
    });
  }

  if (window.__NEWS__) {
    run = window.__RUN__ || null;
    start(window.__NEWS__);
  } else {
    render(); renderScope();
    getJson("data/run.json").then(function (r) { run = r; renderRadar(); }).catch(function () { run = null; });
    getJson("data/news.json").then(start).catch(function () { failed = true; render(); });
  }
})();
</script>
</body>
