[build]
  publish = "."

# Porteiro: só abre com o login do Centro (ver netlify/edge-functions/guard.ts). /reports/ fica aberto para o Resend.
[[edge_functions]]
  path = "/*"
  excludedPath = ["/reports/*"]
  function = "guard"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
